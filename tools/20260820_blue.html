<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue/Green Noise Dithering</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font: 14px system-ui, sans-serif;
    }
    #viewport {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .btn {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0.5rem 0.9rem;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* --- Upper-left file overlay (upload/download) --- */
    #fileToggle {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      left: max(1rem, env(safe-area-inset-left));
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: #1e1e1eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 10;
      user-select: none;
    }
    #filePanel {
      position: fixed;
      top: calc(max(1rem, env(safe-area-inset-top)) + 52px);
      left: max(1rem, env(safe-area-inset-left));
      background: #1e1e1eee;
      border-radius: 16px;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 10;
    }
    #filePanel.hidden { display: none; }
    #filePanel .btn { text-align: center; }

    /* --- Bottom bar: noise type + wide slider --- */
    #bar {
      position: fixed;
      left: max(1rem, env(safe-area-inset-left));
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #1e1e1eee;
      padding: 0.6rem 0.9rem;
      border-radius: 999px;
    }
    #noiseType {
      flex-shrink: 0;
    }
    #scale {
      flex: 1 1 auto;
      min-width: 0;
      width: auto;
    }
  </style>
</head>
<body>

<canvas id="viewport"></canvas>

<div id="fileToggle" title="Files">📁</div>
<div id="filePanel" class="hidden">
  <label id="uploadLabel" class="btn" for="upload">Upload</label>
  <input type="file" id="upload" accept="image/*" hidden>
  <button id="download" class="btn" disabled>💾 Save</button>
</div>

<div id="bar">
  <select id="noiseType" class="btn">
    <option value="blue">Blue</option>
    <option value="green">Green</option>
  </select>
  <input type="range" id="scale" min="0" max="2" step="0.05" value="1.0" title="Noise strength">
</div>

<script>
  const workerCode = `
    const SIZE = 64;
    let blueTex = null;
    let greenTex = null;

    // Classic void-and-cluster generation, parameterized by grid size.
    // When normalize=true, output is scaled to [0,1). When false, output is
    // the raw integer fill-order rank (0..N-1) — needed by generateGreenNoise
    // so it can combine ranks without double-dividing by N.
    function generateVoidCluster(size, normalize) {
        const N = size * size;
        const noise = new Float32Array(N);
        const filled = new Uint8Array(N);

        const sigma = 1.9;
        const lut = new Float32Array(N);

        for(let y = 0; y < size; y++) {
            for(let x = 0; x < size; x++) {
                let dx = x > size/2 ? size - x : x;
                let dy = y > size/2 ? size - y : y;
                lut[y * size + x] = Math.exp(-(dx*dx + dy*dy) / (sigma * sigma));
            }
        }

        let px = Math.floor(Math.random() * size);
        let py = Math.floor(Math.random() * size);
        filled[py * size + px] = 1;
        noise[py * size + px] = 0;

        const energy = new Float32Array(N);
        for(let i = 0; i < N; i++) {
            let ey = Math.floor(i / size), ex = i % size;
            let dx = Math.abs(ex - px), dy = Math.abs(ey - py);
            if(dx > size/2) dx = size - dx;
            if(dy > size/2) dy = size - dy;
            energy[i] += lut[dy * size + dx];
        }

        for (let i = 1; i < N; i++) {
            let minE = Infinity;
            let minIdx = -1;

            for (let j = 0; j < N; j++) {
                if (filled[j] === 0 && energy[j] < minE) {
                    minE = energy[j];
                    minIdx = j;
                }
            }

            filled[minIdx] = 1;
            noise[minIdx] = i; // raw fill-order rank, 0..N-1

            let cx = minIdx % size;
            let cy = Math.floor(minIdx / size);
            for(let j = 0; j < N; j++) {
                if(filled[j] === 0) {
                    let ex = j % size, ey = Math.floor(j / size);
                    let dx = Math.abs(ex - cx), dy = Math.abs(ey - cy);
                    if(dx > size/2) dx = size - dx;
                    if(dy > size/2) dy = size - dy;
                    energy[j] += lut[dy * size + dx];
                }
            }
        }

        if (normalize) {
            for (let k = 0; k < N; k++) noise[k] /= N;
        }
        return noise;
    }

    function generateBlueNoise() {
        return generateVoidCluster(SIZE, true);
    }

    // Green noise: 2x2 clusters distributed via blue-noise ordering, each
    // cluster filled in classic Bayer sub-order. Produces mid-frequency
    // "clumped" dithering instead of blue noise's isolated single pixels.
    function generateGreenNoise() {
        const half = SIZE / 2;
        const baseRank = generateVoidCluster(half, false); // raw ints 0..N-1
        const N = half * half;
        const tex = new Float32Array(SIZE * SIZE);

        const positions = [
            { sx: 0, sy: 0 }, // TL
            { sx: 1, sy: 0 }, // TR
            { sx: 0, sy: 1 }, // BL
            { sx: 1, sy: 1 }  // BR
        ];
        const subRank = [0, 2, 3, 1]; // classic 2x2 Bayer fill order

        for (let cy = 0; cy < half; cy++) {
            for (let cx = 0; cx < half; cx++) {
                const rawRank = baseRank[cy * half + cx];
                for (let s = 0; s < 4; s++) {
                    const rank = subRank[s];
                    const value = (rawRank * 4 + rank) / (N * 4);
                    const ox = cx * 2 + positions[s].sx;
                    const oy = cy * 2 + positions[s].sy;
                    tex[oy * SIZE + ox] = value;
                }
            }
        }
        return tex;
    }

    self.onmessage = function(e) {
        if (e.data.type === 'init') {
            blueTex = generateBlueNoise();
            greenTex = generateGreenNoise();
            self.postMessage({ type: 'ready' });
        }
        else if (e.data.type === 'process') {
            const { imageData, scale, noiseType } = e.data;
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const tex = noiseType === 'green' ? greenTex : blueTex;

            const scaleVal = scale * 255;

            for (let y = 0; y < height; y++) {
                const ny = (y & 63) << 6;
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) << 2;

                    const nx = x & 63;

                    const bn = tex[ny + nx];
                    const offset = (bn - 0.5) * scaleVal;

                    data[idx]   = (data[idx]   + offset) > 127 ? 255 : 0;
                    data[idx+1] = (data[idx+1] + offset) > 127 ? 255 : 0;
                    data[idx+2] = (data[idx+2] + offset) > 127 ? 255 : 0;
                    data[idx+3] = 255;
                }
            }
            self.postMessage({ type: 'result', imageData });
        }
    };
  `;

  const blob = new Blob([workerCode], { type: 'application/javascript' });
  const worker = new Worker(URL.createObjectURL(blob));

  // Off-screen source canvas: holds the original uploaded image at native size.
  const sourceCanvas = document.createElement('canvas');
  const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });

  // Off-screen result canvas: holds the latest dithered output at native size.
  const resultCanvas = document.createElement('canvas');
  const resultCtx = resultCanvas.getContext('2d');

  // Visible fullscreen pan/zoom viewport.
  const viewport = document.getElementById('viewport');
  const vctx = viewport.getContext('2d');

  const scaleInput = document.getElementById('scale');
  const noiseTypeSelect = document.getElementById('noiseType');
  const fileInput = document.getElementById('upload');
  const downloadBtn = document.getElementById('download');
  const fileToggle = document.getElementById('fileToggle');
  const filePanel = document.getElementById('filePanel');

  let isWorkerReady = false;
  let isProcessing = false;
  let pendingProcess = false;
  let hasFitted = false;

  // Pan/zoom state (all in CSS pixels): screenX = imgX * zoom + panX
  let zoom = 1;
  let panX = 0;
  let panY = 0;

  // CSS-pixel dimensions of the viewport, kept separate from the
  // (devicePixelRatio-scaled) canvas backing store.
  let cssW = 0;
  let cssH = 0;
  let dpr = window.devicePixelRatio || 1;

  function resizeViewport() {
    dpr = window.devicePixelRatio || 1;
    cssW = viewport.clientWidth;
    cssH = viewport.clientHeight;
    viewport.width = Math.round(cssW * dpr);
    viewport.height = Math.round(cssH * dpr);
    render();
  }

  function render() {
    vctx.setTransform(1, 0, 0, 1, 0, 0);
    vctx.clearRect(0, 0, viewport.width, viewport.height);
    if (resultCanvas.width > 0) {
      // Only go pixel-perfect once source pixels are actually visible
      // on screen, accounting for device pixel ratio.
      vctx.imageSmoothingEnabled = zoom * dpr < 3;
      vctx.setTransform(zoom * dpr, 0, 0, zoom * dpr, panX * dpr, panY * dpr);
      vctx.drawImage(resultCanvas, 0, 0);
    }
  }

  function fitToScreen() {
    if (resultCanvas.width === 0) return;
    const scale = Math.min(
      cssW / resultCanvas.width,
      cssH / resultCanvas.height
    ) * 0.9;
    zoom = scale;
    panX = (cssW - resultCanvas.width * zoom) / 2;
    panY = (cssH - resultCanvas.height * zoom) / 2;
    render();
  }

  window.addEventListener('resize', resizeViewport);
  resizeViewport();

  // --- File overlay toggle ---
  fileToggle.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    filePanel.classList.toggle('hidden');
  });
  filePanel.addEventListener('pointerdown', (e) => e.stopPropagation());
  document.addEventListener('pointerdown', () => {
    filePanel.classList.add('hidden');
  });

  // --- Pan (drag) + pinch (two-finger zoom) ---
  function getPos(e) {
    const rect = viewport.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  const pointers = new Map();
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;
  let pinchStartMidX = 0, pinchStartMidY = 0;
  let pinchStartPanX = 0, pinchStartPanY = 0;

  function beginPinch() {
    const pts = [...pointers.values()];
    pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchStartZoom = zoom;
    pinchStartMidX = (pts[0].x + pts[1].x) / 2;
    pinchStartMidY = (pts[0].y + pts[1].y) / 2;
    pinchStartPanX = panX;
    pinchStartPanY = panY;
  }

  viewport.addEventListener('pointerdown', (e) => {
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, getPos(e));

    if (pointers.size === 1) {
      isDragging = true;
      const p = getPos(e);
      lastX = p.x;
      lastY = p.y;
    } else if (pointers.size === 2) {
      isDragging = false;
      beginPinch();
    }
  });

  viewport.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, getPos(e));

    if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const midX = (pts[0].x + pts[1].x) / 2;
      const midY = (pts[0].y + pts[1].y) / 2;

      if (pinchStartDist > 0) {
        const newZoom = Math.min(Math.max(pinchStartZoom * (dist / pinchStartDist), 0.05), 64);
        const imgX = (pinchStartMidX - pinchStartPanX) / pinchStartZoom;
        const imgY = (pinchStartMidY - pinchStartPanY) / pinchStartZoom;
        zoom = newZoom;
        panX = midX - imgX * zoom;
        panY = midY - imgY * zoom;
        render();
      }
    } else if (pointers.size === 1 && isDragging) {
      const p = pointers.get(e.pointerId);
      panX += p.x - lastX;
      panY += p.y - lastY;
      lastX = p.x;
      lastY = p.y;
      render();
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      const p = [...pointers.values()][0];
      isDragging = true;
      lastX = p.x;
      lastY = p.y;
    } else if (pointers.size === 2) {
      beginPinch();
    } else {
      isDragging = false;
    }
  }
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);

  // --- Zoom (wheel, centered on cursor) ---
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (resultCanvas.width === 0) return;

    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const imgX = (mx - panX) / zoom;
    const imgY = (my - panY) / zoom;

    const factor = Math.exp(-e.deltaY * 0.001);
    const newZoom = Math.min(Math.max(zoom * factor, 0.05), 64);

    panX = mx - imgX * newZoom;
    panY = my - imgY * newZoom;
    zoom = newZoom;
    render();
  }, { passive: false });

  viewport.addEventListener('dblclick', fitToScreen);

  worker.onmessage = function(e) {
    if (e.data.type === 'ready') {
      isWorkerReady = true;
    }
    else if (e.data.type === 'result') {
      resultCtx.putImageData(e.data.imageData, 0, 0);
      isProcessing = false;
      downloadBtn.disabled = false;

      if (!hasFitted) {
        hasFitted = true;
        fitToScreen();
      } else {
        render();
      }

      if (pendingProcess) {
        pendingProcess = false;
        triggerProcess();
      }
    }
  };

  worker.postMessage({ type: 'init' });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        const MAX_DIM = 1200;

        if (w > MAX_DIM || h > MAX_DIM) {
          const ratio = Math.min(MAX_DIM / w, MAX_DIM / h);
          w = Math.floor(w * ratio);
          h = Math.floor(h * ratio);
        }

        sourceCanvas.width = w;
        sourceCanvas.height = h;
        resultCanvas.width = w;
        resultCanvas.height = h;

        sourceCtx.drawImage(img, 0, 0, w, h);
        hasFitted = false;
        downloadBtn.disabled = true;
        triggerProcess();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
    filePanel.classList.add('hidden');
  });

  scaleInput.addEventListener('input', requestRender);
  noiseTypeSelect.addEventListener('change', requestRender);

  downloadBtn.addEventListener('click', () => {
    if (resultCanvas.width === 0) return;
    const link = document.createElement('a');
    link.download = 'noise-dither.png';
    link.href = resultCanvas.toDataURL('image/png');
    link.click();
  });

  function requestRender() {
    if (sourceCanvas.width > 0) {
      if (isProcessing) {
        pendingProcess = true;
      } else {
        triggerProcess();
      }
    }
  }

  function triggerProcess() {
    if (!isWorkerReady || sourceCanvas.width === 0) return;

    isProcessing = true;

    const imageData = sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);

    worker.postMessage({
      type: 'process',
      imageData: imageData,
      scale: parseFloat(scaleInput.value),
      noiseType: noiseTypeSelect.value
    });
  }
</script>
</body>
</html>
