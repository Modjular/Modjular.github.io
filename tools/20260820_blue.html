<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Noise Dithering with X-Stretch</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font: 14px system-ui, sans-serif;
    }
    #viewport {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    #bar {
      position: fixed;
      left: 50%;
      bottom: max(1rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #1e1e1eee;
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      max-width: calc(100vw - 1rem);
    }
    #bar button, #bar label {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0.5rem 0.9rem;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    #bar button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #scale {
      width: 100px;
    }
  </style>
</head>
<body>

<canvas id="viewport"></canvas>

<div id="bar">
  <label id="uploadLabel" for="upload">Upload</label>
  <input type="file" id="upload" accept="image/*" hidden>

  <input type="range" id="scale" min="0" max="2" step="0.05" value="1.0" title="Noise strength">

  <button id="download" disabled>💾</button>
</div>

<script>
  const workerCode = `
    const SIZE = 64;
    let noiseTex = null;

    function generateBlueNoise() {
        const N = SIZE * SIZE;
        const noise = new Float32Array(N);
        const filled = new Uint8Array(N);

        const sigma = 1.9;
        const lut = new Float32Array(N);

        for(let y = 0; y < SIZE; y++) {
            for(let x = 0; x < SIZE; x++) {
                let dx = x > SIZE/2 ? SIZE - x : x;
                let dy = y > SIZE/2 ? SIZE - y : y;
                lut[y * SIZE + x] = Math.exp(-(dx*dx + dy*dy) / (sigma * sigma));
            }
        }

        let px = Math.floor(Math.random() * SIZE);
        let py = Math.floor(Math.random() * SIZE);
        filled[py * SIZE + px] = 1;
        noise[py * SIZE + px] = 0;

        const energy = new Float32Array(N);
        for(let i = 0; i < N; i++) {
            let ey = Math.floor(i / SIZE), ex = i % SIZE;
            let dx = Math.abs(ex - px), dy = Math.abs(ey - py);
            if(dx > SIZE/2) dx = SIZE - dx;
            if(dy > SIZE/2) dy = SIZE - dy;
            energy[i] += lut[dy * SIZE + dx];
        }

        for (let i = 1; i < N; i++) {
            let minE = Infinity;
            let minIdx = -1;

            for (let j = 0; j < N; j++) {
                if (filled[j] === 0 && energy[j] < minE) {
                    minE = energy[j];
                    minIdx = j;
                }
            }

            filled[minIdx] = 1;
            noise[minIdx] = i / N;

            let cx = minIdx % SIZE;
            let cy = Math.floor(minIdx / SIZE);
            for(let j = 0; j < N; j++) {
                if(filled[j] === 0) {
                    let ex = j % SIZE, ey = Math.floor(j / SIZE);
                    let dx = Math.abs(ex - cx), dy = Math.abs(ey - cy);
                    if(dx > SIZE/2) dx = SIZE - dx;
                    if(dy > SIZE/2) dy = SIZE - dy;
                    energy[j] += lut[dy * SIZE + dx];
                }
            }
        }
        return noise;
    }

    self.onmessage = function(e) {
        if (e.data.type === 'init') {
            noiseTex = generateBlueNoise();
            self.postMessage({ type: 'ready' });
        }
        else if (e.data.type === 'process') {
            const { imageData, scale } = e.data;
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;

            const scaleVal = scale * 255;

            for (let y = 0; y < height; y++) {
                const ny = (y & 63) << 6;
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) << 2;

                    const nx = x & 63;

                    const bn = noiseTex[ny + nx];
                    const offset = (bn - 0.5) * scaleVal;

                    data[idx]   = (data[idx]   + offset) > 127 ? 255 : 0;
                    data[idx+1] = (data[idx+1] + offset) > 127 ? 255 : 0;
                    data[idx+2] = (data[idx+2] + offset) > 127 ? 255 : 0;
                    data[idx+3] = 255;
                }
            }
            self.postMessage({ type: 'result', imageData });
        }
    };
  `;

  const blob = new Blob([workerCode], { type: 'application/javascript' });
  const worker = new Worker(URL.createObjectURL(blob));

  // Off-screen source canvas: holds the original uploaded image at native size.
  const sourceCanvas = document.createElement('canvas');
  const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });

  // Off-screen result canvas: holds the latest dithered output at native size.
  const resultCanvas = document.createElement('canvas');
  const resultCtx = resultCanvas.getContext('2d');

  // Visible fullscreen pan/zoom viewport.
  const viewport = document.getElementById('viewport');
  const vctx = viewport.getContext('2d');

  const scaleInput = document.getElementById('scale');
  const fileInput = document.getElementById('upload');
  const downloadBtn = document.getElementById('download');

  let isWorkerReady = false;
  let isProcessing = false;
  let pendingProcess = false;
  let hasFitted = false;

  // Pan/zoom state (all in CSS pixels): screenX = imgX * zoom + panX
  let zoom = 1;
  let panX = 0;
  let panY = 0;

  // CSS-pixel dimensions of the viewport, kept separate from the
  // (devicePixelRatio-scaled) canvas backing store.
  let cssW = 0;
  let cssH = 0;
  let dpr = window.devicePixelRatio || 1;

  function resizeViewport() {
    dpr = window.devicePixelRatio || 1;
    cssW = viewport.clientWidth;
    cssH = viewport.clientHeight;
    viewport.width = Math.round(cssW * dpr);
    viewport.height = Math.round(cssH * dpr);
    render();
  }

  function render() {
    vctx.setTransform(1, 0, 0, 1, 0, 0);
    vctx.clearRect(0, 0, viewport.width, viewport.height);
    if (resultCanvas.width > 0) {
      // Only go pixel-perfect once source pixels are actually visible
      // on screen, accounting for device pixel ratio.
      vctx.imageSmoothingEnabled = zoom * dpr < 3;
      vctx.setTransform(zoom * dpr, 0, 0, zoom * dpr, panX * dpr, panY * dpr);
      vctx.drawImage(resultCanvas, 0, 0);
    }
  }

  function fitToScreen() {
    if (resultCanvas.width === 0) return;
    const scale = Math.min(
      cssW / resultCanvas.width,
      cssH / resultCanvas.height
    ) * 0.9;
    zoom = scale;
    panX = (cssW - resultCanvas.width * zoom) / 2;
    panY = (cssH - resultCanvas.height * zoom) / 2;
    render();
  }

  window.addEventListener('resize', resizeViewport);
  resizeViewport();

  // --- Pan (drag) ---
  let isDragging = false;
  let lastX = 0, lastY = 0;

  viewport.addEventListener('pointerdown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    viewport.setPointerCapture(e.pointerId);
  });

  viewport.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX += e.clientX - lastX;
    panY += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    render();
  });

  function endDrag() {
    isDragging = false;
  }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);

  // --- Zoom (wheel, centered on cursor) ---
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (resultCanvas.width === 0) return;

    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const imgX = (mx - panX) / zoom;
    const imgY = (my - panY) / zoom;

    const factor = Math.exp(-e.deltaY * 0.001);
    const newZoom = Math.min(Math.max(zoom * factor, 0.05), 64);

    panX = mx - imgX * newZoom;
    panY = my - imgY * newZoom;
    zoom = newZoom;
    render();
  }, { passive: false });

  viewport.addEventListener('dblclick', fitToScreen);

  worker.onmessage = function(e) {
    if (e.data.type === 'ready') {
      isWorkerReady = true;
    }
    else if (e.data.type === 'result') {
      resultCtx.putImageData(e.data.imageData, 0, 0);
      isProcessing = false;
      downloadBtn.disabled = false;

      if (!hasFitted) {
        hasFitted = true;
        fitToScreen();
      } else {
        render();
      }

      if (pendingProcess) {
        pendingProcess = false;
        triggerProcess();
      }
    }
  };

  worker.postMessage({ type: 'init' });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        const MAX_DIM = 1200;

        if (w > MAX_DIM || h > MAX_DIM) {
          const ratio = Math.min(MAX_DIM / w, MAX_DIM / h);
          w = Math.floor(w * ratio);
          h = Math.floor(h * ratio);
        }

        sourceCanvas.width = w;
        sourceCanvas.height = h;
        resultCanvas.width = w;
        resultCanvas.height = h;

        sourceCtx.drawImage(img, 0, 0, w, h);
        hasFitted = false;
        downloadBtn.disabled = true;
        triggerProcess();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  scaleInput.addEventListener('input', requestRender);

  downloadBtn.addEventListener('click', () => {
    if (resultCanvas.width === 0) return;
    const link = document.createElement('a');
    link.download = 'blue-noise-dither.png';
    link.href = resultCanvas.toDataURL('image/png');
    link.click();
  });

  function requestRender() {
    if (sourceCanvas.width > 0) {
      if (isProcessing) {
        pendingProcess = true;
      } else {
        triggerProcess();
      }
    }
  }

  function triggerProcess() {
    if (!isWorkerReady || sourceCanvas.width === 0) return;

    isProcessing = true;

    const imageData = sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);

    worker.postMessage({
      type: 'process',
      imageData: imageData,
      scale: parseFloat(scaleInput.value)
    });
  }
</script>
</body>
</html>
